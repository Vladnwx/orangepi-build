# /var/log lives in RAM on the OrangePi Zero 2W (see the fstab entry added by
# the board support package), so the directories that services expect have to be
# recreated at boot. tmpfiles.d runs before syslog/rsyslog and before Samba.
#
# family_tweaks_s additionally writes var-log-generated.conf with every
# subdirectory the image itself ships; the entries here cover what may be
# installed later.
d /var/log/apt 0755 root root -
d /var/log/journal 0755 root systemd-journal -
d /var/log/private 0700 root root -
d /var/log/samba 0755 root root -

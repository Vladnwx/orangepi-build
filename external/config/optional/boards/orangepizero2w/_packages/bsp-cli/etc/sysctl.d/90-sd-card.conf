# Keep the SD card alive on the OrangePi Zero 2W.
#
# The card is the only writable medium and it is usually the first thing to
# fail on these boards, so batch and defer writes as much as the kernel allows.
# The root filesystem is already mounted with noatime,commit=600 (see /etc/fstab).

# Write back dirty data every 60s instead of every 5s, and let dirty pages live
# for a minute. This coalesces the many small writes of a mostly idle system
# into a few larger ones, which is what flash likes.
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs = 6000

# Keep the amount of dirty data that can pile up small enough to avoid long
# bursts, but still flush in the background early.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20

# The card is the slow part, not the VFS caches: keep dentries/inodes around.
vm.vfs_cache_pressure = 50

# There is no disk-backed swap, only zram (orangepi-zram-config), so let the
# kernel use it aggressively instead of dropping file cache.
vm.swappiness = 100
vm.page-cluster = 0
